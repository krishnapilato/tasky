name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint with SonarJS rules and Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  workflows:
    name: actionlint with shellcheck for the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
