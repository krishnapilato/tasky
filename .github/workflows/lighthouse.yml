name: Lighthouse

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Performance 90+, accessibility, best practices and SEO 100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 27
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: mvn --batch-mode --no-transfer-progress package
      - run: npm ci
      - name: Start the Java server and the Pages version
        run: |
          PORT=8091 java -jar target/tasky.jar > server.log 2>&1 &
          node tests/pages-server.js 8092 &
          for _ in $(seq 1 30); do curl --silent --fail http://localhost:8091/api/account > /dev/null && break; sleep 1; done
      - run: npm run lighthouse -- http://localhost:8091/
      - run: npm run lighthouse -- http://localhost:8092/tasky/
