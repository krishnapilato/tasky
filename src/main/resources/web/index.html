<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <!-- The import-map hash and local dependency integrity values are maintained by npm run sync:assets. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-IiNiwAyiiP3jLMAr9rqO0bFDRIEGXr9Or7p6ugGJ9t4='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
    <meta name="description" content="Tasky is a task list with due dates and priorities.">
    <title>Tasky</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap">
    <link rel="stylesheet" data-package="pico" href="./vendor/pico.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
    <script type="importmap">{"imports":{"alpine":"./vendor/alpine.js","valibot":"./vendor/valibot.js"},"integrity":{"./vendor/alpine.js":"sha384-KgWcSex7FnXs268HWoMlffwaTiBOcFl8WV6dmZP4gEJvo01zFIZnt4/UcuqUTZyX","./vendor/valibot.js":"sha384-eZ9ccd0KJ9ObJWvX6OUA7elFLamaocoV2RZBfsSrMsFvkTJ7M3g25qfdzY5xzZGX"}}</script>
</head>
<body x-data="tasky" @contextmenu.prevent>
<p class="sr-only" role="status" x-text="busy ? 'Please wait…' : ''"></p>
<main class="auth" id="auth" :hidden="user" x-cloak>
    <form id="account" x-ref="account" novalidate @input="clearFieldError($event)" @submit.prevent="authenticate($event)">
        <img src="icon.svg" alt="" width="44" height="44">
        <div><p class="eyebrow">A LITTLE MORE CLARITY</p><h1 x-text="authTitle">Sign in to Tasky</h1><p class="auth-intro">A quiet place for everything you need to do.</p></div>
        <div class="alert" id="auth-error" role="alert" :hidden="!error" x-text="error"></div>
        <button class="outline" id="retry" type="button" :hidden="ready" :disabled="busy" @click="start()">Try again</button>
        <fieldset :disabled="busy || !ready">
            <div id="name-field" :hidden="!registering">
                <label for="name">Name</label>
                <input id="name" name="name" autocomplete="name" maxlength="80" :required="registering">
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" :autocomplete="registering ? 'new-password' : 'current-password'" minlength="8" maxlength="1024" required>
            </div>
            <button id="submit" x-text="authSubmit">Sign in</button>
            <button class="outline secondary" id="try" type="button" @click="tryDemo()">Try the demo account</button>
            <p>or <button class="btn-link" id="switch" type="button" @click="switchAuth()" x-text="authSwitch">Create an account</button></p>
        </fieldset>
    </form>
</main>

<div id="app" :hidden="!user" x-cloak>
    <header class="topbar">
        <a class="brand" href="./"><img src="icon.svg" alt="" width="22" height="22">Tasky</a>
        <span class="who" id="who" x-text="email"></span>
        <button class="outline secondary" id="logout" type="button" :disabled="busy" @click="logout()">Sign out</button>
    </header>
    <main class="page">
        <p class="eyebrow">ONE THING AT A TIME</p>
        <h1 id="hello" x-text="hello">Hello</h1>
        <p class="summary" id="summary" x-text="summary"></p>
        <div class="alert" id="error" role="alert" :hidden="!error" x-text="error"></div>
        <form class="composer" id="add" novalidate @input="clearFieldError($event)" @submit.prevent="add($event)">
            <label class="composer-label" for="new-title">What needs doing?</label>
            <fieldset class="add" :disabled="busy">
                <div class="field task-field"><input id="new-title" x-ref="newTitle" name="title" placeholder="Write your next task…" aria-label="Task title" maxlength="50" required></div>
                <div class="field"><input name="due" type="text" placeholder="dd/mm/yyyy" aria-label="Due date (dd/mm/yyyy)" maxlength="10" autocomplete="off"></div>
                <div class="field"><select name="priority" aria-label="Priority">
                    <option value="none">No priority</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
                </select></div>
                <button><span aria-hidden="true">＋</span> Add task</button>
            </fieldset>
        </form>
        <nav class="filters" id="filters" aria-label="Filter tasks">
            <button type="button" data-filter="open" :class="{active: filter === 'open'}" :aria-pressed="filter === 'open'" @click="selectFilter('open')">Open <span x-text="count('open')"></span></button>
            <button type="button" data-filter="today" :class="{active: filter === 'today'}" :aria-pressed="filter === 'today'" @click="selectFilter('today')">Today <span x-text="count('today')"></span></button>
            <button type="button" data-filter="done" :class="{active: filter === 'done'}" :aria-pressed="filter === 'done'" @click="selectFilter('done')">Done <span x-text="count('done')"></span></button>
        </nav>
        <ul class="tasks" id="tasks">
            <template x-for="task in shown" :key="task.id">
                <li class="task" :class="{done: task.done}" :data-id="task.id">
                    <label class="check-target"><input class="check" type="checkbox" :aria-label="task.done ? 'Reopen ' + task.title : 'Complete ' + task.title" :checked="task.done" :disabled="busy" @change="toggle(task, $event)"></label>
                    <button class="task-title" type="button" :disabled="busy" @click="edit(task)" x-text="task.title"></button>
                    <svg class="task-notes" :hidden="!task.notes" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-label="Has notes"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg>
                    <svg class="task-flag" :class="task.priority" :aria-label="task.priority + ' priority'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" role="img"><path d="M5 21V4c5-5 9 5 14 0v10c-5 5-9-5-14 0"/></svg>
                    <span class="task-due" :class="{late: isLate(task)}" x-text="dueLabel(task.due)"></span>
                </li>
            </template>
        </ul>
        <p class="empty" id="empty" :hidden="shown.length" x-text="empty"></p>
        <p class="note" id="demo-note" :hidden="!demo">This demo keeps your tasks in this browser. <button class="btn-link" id="reset" type="button" @click="reset()">Start over</button></p>
    </main>
</div>

<dialog id="editor" x-ref="editor" aria-label="Edit task" @cancel.prevent="cancel()">
    <article>
        <header class="editor-heading"><div><p class="eyebrow">MAKE ROOM FOR THE DETAILS</p><h2>Edit task</h2></div><button class="close-button" type="button" aria-label="Close editor" :disabled="busy" @click="cancel()">×</button></header>
        <form id="edit" x-ref="edit" novalidate @input="clearFieldError($event)" @submit.prevent="save($event)">
            <div class="alert" id="edit-error" role="alert" :hidden="!error" x-text="error"></div>
            <fieldset :disabled="busy">
                <div class="dialog-body">
                    <div><label for="edit-title">Task <span class="optional">50 characters max</span></label><input id="edit-title" name="title" aria-label="Title" maxlength="50" required></div>
                    <div><label for="edit-notes">Notes <span class="optional">optional · 150 characters max</span></label><textarea id="edit-notes" name="notes" rows="4" placeholder="Add a little context…" aria-label="Notes" maxlength="150"></textarea></div>
                    <div class="grid">
                        <div><label for="edit-due">Due <span class="optional">dd/mm/yyyy</span></label><input id="edit-due" name="due" type="text" placeholder="dd/mm/yyyy" maxlength="10" autocomplete="off"></div>
                        <div><label for="edit-priority">Priority</label><select id="edit-priority" name="priority"><option value="none">No priority</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
                    </div>
                </div>
                <footer class="dialog-footer">
                    <button class="outline danger" id="delete" type="button" @click="remove()" x-text="deleteLabel">Delete</button>
                    <button class="outline secondary" type="button" @click="cancel()">Cancel</button>
                    <button>Save changes</button>
                </footer>
            </fieldset>
        </form>
    </article>
</dialog>
<noscript>Tasky needs JavaScript to run.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
