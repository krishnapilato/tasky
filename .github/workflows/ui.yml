name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    name: Playwright on the Java server and the Pages version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 27
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: mvn --batch-mode --no-transfer-progress package
      - run: npm ci
      - run: npm run test:ui
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report
