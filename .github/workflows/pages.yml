name: Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  lint:
    uses: ./.github/workflows/lint.yml

  ui:
    uses: ./.github/workflows/ui.yml

  lighthouse:
    uses: ./.github/workflows/lighthouse.yml

  deploy:
    name: Deploy only when every check passes
    needs: [ build, lint, ui, lighthouse ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/main/resources/web
      - id: deployment
        uses: actions/deploy-pages@v5
